<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedro ❤️ Yasmin</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#050505;
    color:white;
    font-family:Poppins,sans-serif;
}

.container{
    position:relative;
    width:100vw;
    height:100vh;
}

.bg{
    position:absolute;
    inset:0;
    background:url('foto.jpg') center center;
    background-size:cover;
    filter:brightness(.35);
    animation:zoom 25s ease-in-out infinite alternate;
}

.overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(
    rgba(0,0,0,.25),
    rgba(0,0,0,.55),
    rgba(0,0,0,.9)
    );
}

.content{
    position:relative;
    z-index:10;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:30px;
}

h1{
    font-family:'Playfair Display', serif;
    font-size:4rem;
    margin-bottom:15px;
    animation:fadeUp 2s ease;
}

.date{
    opacity:.85;
    margin-bottom:40px;
    font-size:1rem;
}

.message{
    max-width:900px;
    font-size:1.4rem;
    line-height:2.2rem;
    animation:fadeUp 3s ease;
}

.heart{
    font-size:3rem;
    margin:25px 0;
    animation:pulse 2s infinite;
}

.counter{
    margin-top:35px;
    font-size:1rem;
    opacity:.9;
}

.music{
    margin-top:25px;
}

.music a{
    text-decoration:none;
    color:white;
    border:1px solid rgba(255,255,255,.3);
    padding:12px 25px;
    border-radius:50px;
    transition:.3s;
}

.music a:hover{
    background:white;
    color:black;
}

.star{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    opacity:.6;
    animation:twinkle 4s infinite;
}

@keyframes pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.15);}
}

@keyframes zoom{
    from{transform:scale(1);}
    to{transform:scale(1.15);}
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes twinkle{
    0%,100%{opacity:.2;}
    50%{opacity:1;}
}

@media(max-width:768px){

    h1{
        font-size:2.5rem;
    }

    .message{
        font-size:1.1rem;
        line-height:1.8rem;
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="bg"></div>
    <div class="overlay"></div>

    <div class="content">

        <h1>Pedro ❤️ Yasmin</h1>

        <div class="date">
            Desde 07 de Março de 2026
        </div>

        <div class="heart">❤️</div>

        <div class="message" id="texto"></div>

        <div class="counter" id="contador"></div>

        <div class="music">
            <a href="https://www.youtube.com/results?search_query=Não+Olhe+Assim+Leandro+e+Leonardo"
            target="_blank">
            🎵 Nossa Música
            </a>
        </div>

    </div>

</div>

<script>

const frase =
"Te escolhi, escolho e escolherei todos os dias até o fim da minha vida. Eu te amo de forma imensurável.";

let i = 0;

function escrever(){

    if(i < frase.length){

        document.getElementById("texto").innerHTML += frase.charAt(i);
        i++;

        setTimeout(escrever,50);
    }
}

escrever();

const inicio = new Date("2026-03-07");

function atualizarTempo(){

    const hoje = new Date();

    const diff = hoje - inicio;

    const dias = Math.floor(diff/(1000*60*60*24));

    document.getElementById("contador").innerHTML =
    "❤️ Vivendo essa história há " + dias + " dias";
}

atualizarTempo();
setInterval(atualizarTempo,1000);

for(let i=0;i<120;i++){

    let star = document.createElement("div");

    star.classList.add("star");

    star.style.left = Math.random()*100+"%";
    star.style.top = Math.random()*100+"%";

    star.style.animationDelay = Math.random()*5+"s";

    document.body.appendChild(star);
}

</script>

</body>
</html>
